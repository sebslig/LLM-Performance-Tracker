[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-dashboard"
version = "0.1.0"
description = "A performance tracking dashboard for LLMs using OpenClaw"
requires-python = ">=3.9"
dependencies = [
    "streamlit",
    "pandas",
    "plotly",
]
